name: CI

on:
  pull_request:
    # `labeled` re-runs CI when `input-updates` is added, so the tests run
    # against fresh inputs without needing a new commit
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    tags: ['v*']

# adding labels re-runs CI, so a newer run on the same pull request cancels the
# older one; pushes each get their own group and are never cancelled
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # A pull request labelled `input-updates` changes inputs or how they're
  # fetched, so its tests skip the shared test data cache and fetch every input.
  # When one is merged, the push to main deletes the cache before the tests
  # restore it, so that run fetches every input and saves a fresh cache.
  input-updates:
    name: Detect input updates
    runs-on: ubuntu-26.04
    permissions:
      actions: write # deleting the test data cache
      pull-requests: read # finding the pull request a push to main merged
    outputs:
      labelled: ${{ steps.label.outputs.labelled }}
    steps:
      - name: Check for the input-updates label
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'input-updates') }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            labelled=$PR_LABELLED
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            labelled=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" \
              --jq 'any(.[]; .merged_at != null and any(.labels[]; .name == "input-updates"))')
          else
            labelled=false
          fi
          echo "labelled=$labelled" >> "$GITHUB_OUTPUT"
      - name: Delete the test data cache
        if: github.event_name == 'push' && steps.label.outputs.labelled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # `--key` matches a prefix, so select the exact key
          count=$(gh cache list --key test-data-cache --limit 100 --json key \
            --jq '[.[] | select(.key == "test-data-cache")] | length')
          if [ "$count" -eq 0 ]; then
            echo "No test-data-cache to delete"
          else
            gh cache delete test-data-cache
          fi

  # a job skipped by its `if` reports success, so required checks still pass
  changes:
    name: Detect changes needing checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read # pull requests list their files through the API
    outputs:
      # anything other than a pull request or a push to main (tags, manual
      # runs) skips the filter, and so always runs everything
      checks: ${{ steps.filter.outputs.checks || 'true' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - id: filter
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # pushes to main compare against the previous push; pull requests
          # ignore this and use their files from the API
          base: main
          predicate-quantifier: every
          filters: .github/ci-paths.yml

  tests:
    needs: [changes, input-updates]
    # input updates run the tests even when only markdown changed, such as a
    # pull request for an edited Google Sheet
    if: needs.changes.outputs.checks == 'true' || needs.input-updates.outputs.labelled == 'true'
    # fetching every input takes up to about 20 minutes; "Run tests" has a
    # shorter limit when the cache is restored
    timeout-minutes: 40
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install the project
        run: |
          uv sync --locked --all-extras --dev
      # labelled pull requests test against fresh inputs and save no cache. On
      # main, `input-updates` has already deleted the cache, so this restores
      # nothing and saves a fresh cache once the tests pass
      - name: Cache test data
        id: test-data
        if: github.event_name != 'pull_request' || needs.input-updates.outputs.labelled != 'true'
        uses: actions/cache@v4
        with:
          path: data/.cache
          key: test-data-cache
      # Fetch GFAS data from public data store so ADS credentials aren't needed
      - name: Fetch GFAS test data
        run: |
          mkdir -p data/.cache/inputs
          curl -L -o data/.cache/inputs/gfas_2022-12-07_2022-12-08.nc "https://openmethane.s3.amazonaws.com/tests/gfas/gfas_2022-12-07_2022-12-08.nc"
      - name: Run tests
        timeout-minutes: ${{ steps.test-data.outputs.cache-hit == 'true' && 15 || 35 }}
        run: |
          uv run python -m pytest -r a -v tests -k "not test_cdsapi_connection"
        env:
          INPUT_CACHE: data/.cache
      # Run tests which require GitHub Actions secrets only on internal PRs and merges
      - name: Run tests with credentials
        if: '!github.event.push.repository.fork && !github.event.pull_request.head.repo.fork'
        run: |
          uv run python -m pytest -r a -v tests -k "test_cdsapi_connection"
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_ADS_KEY }}
          CDSAPI_URL: https://ads.atmosphere.copernicus.eu/api

  # formatting is cheap to check and has no dependency on the test data, so it
  # runs on every change; the ruff version comes from uv.lock, matching
  # `make format`
  check-format:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install the project
        run: |
          uv sync --locked --all-extras --dev
      - name: Check formatting
        run: |
          uv run ruff format --check .

  check-build:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build package
        run: |
          uv build
      - name: Check build
        run: |
          tar -tvf dist/openmethane_prior-*.tar.gz --wildcards '*openmethane_prior/py.typed'