name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  # a job skipped by its `if` reports success, so required checks still pass
  changes:
    name: Detect changes needing checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # pull requests list their files through the API
    outputs:
      # anything other than a pull request or a push to main (tags, manual
      # runs) skips the filter, and so always runs everything
      checks: ${{ steps.filter.outputs.checks || 'true' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - id: filter
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # pushes to main compare against the previous push; pull requests
          # ignore this and use their files from the API
          base: main
          predicate-quantifier: every
          filters: .github/ci-paths.yml

  tests:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    timeout-minutes: 20
    runs-on: "ubuntu-latest"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install the project
        run: |
          uv sync --locked --all-extras --dev
      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: data/.cache
          key: test-data-cache
      # Fetch GFAS data from public data store so ADS credentials aren't needed
      - name: Fetch GFAS test data
        run: |
          mkdir -p data/.cache/inputs
          curl -L -o data/.cache/inputs/gfas_2022-12-07_2022-12-08.nc "https://openmethane.s3.amazonaws.com/tests/gfas/gfas_2022-12-07_2022-12-08.nc"
      - name: Run tests
        run: |
          uv run python -m pytest -r a -v tests -k "not test_cdsapi_connection" -m "not long_running"
        env:
          INPUT_CACHE: data/.cache
      # Run tests which require GitHub Actions secrets only on internal PRs and merges
      - name: Run tests with credentials
        if: '!github.event.push.repository.fork && !github.event.pull_request.head.repo.fork'
        run: |
          uv run python -m pytest -r a -v tests -k "test_cdsapi_connection"
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_ADS_KEY }}
          CDSAPI_URL: https://ads.atmosphere.copernicus.eu/api

  check-build:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build package
        run: |
          uv build
      - name: Check build
        run: |
          tar -tvf dist/openmethane_prior-*.tar.gz --wildcards '*openmethane_prior/py.typed'